---
# サンプル Secret。実際の運用では External Secrets Operator や AWS Secrets Manager との
# 連携を利用し、平文の値はコミットしないこと。
# 値はすべてプレースホルダー (Base64 エンコード) で、デプロイ前に必ず差し替えること。
apiVersion: v1
kind: Secret
metadata:
  name: petclinic-db
  namespace: petclinic
  labels:
    app: petclinic
    app.kubernetes.io/name: petclinic
type: Opaque
stringData:
  # 例: jdbc:postgresql://<rds-endpoint>:5432/petclinic
  RDS_URL: "REPLACE_ME_RDS_URL"
  RDS_USERNAME: "REPLACE_ME_RDS_USERNAME"
  RDS_PASSWORD: "REPLACE_ME_RDS_PASSWORD"
