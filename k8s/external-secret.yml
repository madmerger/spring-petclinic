# ExternalSecret template for production use.
# Requires the External Secrets Operator to be installed in the cluster.
# Configure the SecretStore to point to your cloud provider's secret manager
# (e.g., AWS Secrets Manager, GCP Secret Manager, Azure Key Vault).
#
# Reference: https://external-secrets.io/latest/
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: petclinic-secret-store
spec:
  provider:
    # === AWS Secrets Manager ===
    # aws:
    #   service: SecretsManager
    #   region: ap-northeast-1
    #   auth:
    #     jwt:
    #       serviceAccountRef:
    #         name: external-secrets-sa

    # === GCP Secret Manager ===
    # gcpsm:
    #   projectID: my-gcp-project
    #   auth:
    #     workloadIdentity:
    #       clusterLocation: asia-northeast1
    #       clusterName: my-cluster
    #       serviceAccountRef:
    #         name: external-secrets-sa

    # Placeholder - uncomment one of the providers above
    aws:
      service: SecretsManager
      region: ap-northeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: petclinic-db-external
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: petclinic-secret-store
    kind: SecretStore
  target:
    name: demo-db
    # NOTE: 'Owner' policy requires that the dummy Secret from db.yml is NOT
    # present. Use the production Kustomize overlay (which deletes the dummy
    # Secret) or manually delete it before applying this ExternalSecret.
    creationPolicy: Owner
    template:
      type: servicebinding.io/postgresql
      data:
        type: "postgresql"
        provider: "postgresql"
        host: "{{ .host }}"
        port: "{{ .port }}"
        database: "{{ .database }}"
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: host
      remoteRef:
        key: petclinic/database
        property: host
    - secretKey: port
      remoteRef:
        key: petclinic/database
        property: port
    - secretKey: database
      remoteRef:
        key: petclinic/database
        property: database
    - secretKey: username
      remoteRef:
        key: petclinic/database
        property: username
    - secretKey: password
      remoteRef:
        key: petclinic/database
        property: password
