apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: dsyer/petclinic
    newName: ghcr.io/madmerger/spring-petclinic
    newTag: latest

patches:
  - target:
      kind: Deployment
      name: petclinic
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

  # Remove in-cluster DB deployment for production (use managed DB)
  - target:
      kind: Deployment
      name: demo-db
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: demo-db

  - target:
      kind: Service
      name: demo-db
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: demo-db
