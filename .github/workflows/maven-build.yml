# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{matrix.java}}
        uses: actions/setup-java@v4
        with:
          java-version: ${{matrix.java}}
          distribution: 'adopt'
          cache: maven
      - name: Build with Maven Wrapper
        run: ./mvnw -B verify
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-jdk${{matrix.java}}
          path: target/site/jacoco/
      - name: JaCoCo coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            echo "## JaCoCo Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Class | Instruction Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|---------------------|" >> $GITHUB_STEP_SUMMARY
            tail -n +2 target/site/jacoco/jacoco.csv | while IFS=',' read -r group pkg class mi ci mb cb ml cl cxm cxc mm cm; do
              total=$((mi + ci))
              if [ "$total" -gt 0 ]; then
                pct=$((ci * 100 / total))
              else
                pct=0
              fi
              echo "| ${pkg}.${class} | ${pct}% (${ci}/${total}) |" >> $GITHUB_STEP_SUMMARY
            done
          fi
