name: Deploy and Test Cluster

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
  pull_request:
    branches: [main]
    paths:
      - 'k8s/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-and-test-cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build container image
        run: ./mvnw spring-boot:build-image -DskipTests -Dspring-boot.build-image.imageName=petclinic:test

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1

      - name: Load image into Kind cluster
        run: kind load docker-image petclinic:test

      - name: Deploy application with test image
        run: |
          # Apply base manifests (excluding Kustomize overlays, HPA, Ingress, and ExternalSecret)
          kubectl apply -f k8s/db.yml
          cat k8s/petclinic.yml | sed 's|image: dsyer/petclinic|image: petclinic:test|' | sed 's|imagePullPolicy: Always|imagePullPolicy: Never|' | kubectl apply -f -

      - name: Wait for Pods to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=demo-db --timeout=180s
          kubectl wait --for=condition=ready pod -l app=petclinic --timeout=180s

      - name: Smoke test - check application health
        run: |
          kubectl port-forward svc/petclinic 8080:80 &
          sleep 5
          curl -f http://localhost:8080/actuator/health || exit 1
