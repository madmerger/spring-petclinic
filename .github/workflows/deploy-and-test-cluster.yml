name: Deploy and Test Cluster

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
  pull_request:
    branches: [main]
    paths:
      - 'k8s/**'

jobs:
  deploy-and-test-cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1

      - name: Build Docker image for Kind
        run: |
          docker build -t ghcr.io/madmerger/spring-petclinic:latest .

      - name: Load image into Kind cluster
        run: |
          kind load docker-image ghcr.io/madmerger/spring-petclinic:latest --name chart-testing

      - name: Deploy application
        run: |
          kubectl apply -f k8s/db.yml
          kubectl apply -f k8s/petclinic.yml
          kubectl apply -f k8s/pdb.yml

      - name: Wait for Pods to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=demo-db --timeout=180s
          kubectl wait --for=condition=ready pod -l app=petclinic --timeout=180s
