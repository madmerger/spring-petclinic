# Production environment overrides
replicaCount: 3

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: petclinic.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - petclinic.example.com
      secretName: petclinic-prod-tls

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  minReplicas: 3
  maxReplicas: 10

spring:
  profiles: postgres,cloud

database:
  storage: 50Gi
