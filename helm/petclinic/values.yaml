# Default values for petclinic

replicaCount: 2

image:
  repository: ghcr.io/madmerger/spring-petclinic
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: petclinic.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

spring:
  profiles: postgres

database:
  host: demo-db
  port: 5432
  name: petclinic
  username: "CHANGE_ME"
  password: "CHANGE_ME"
  storage: 10Gi
