# =============================================================================
# Spring PetClinic - Production Profile (ECS Fargate + RDS PostgreSQL)
# Activate with: SPRING_PROFILES_ACTIVE=prod
# =============================================================================

# --- Database (RDS PostgreSQL) -----------------------------------------------
database=postgres
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/petclinic}
spring.datasource.username=${POSTGRES_USER:petclinic}
spring.datasource.password=${POSTGRES_PASS:}
# SQL is written to be idempotent so this is safe
spring.sql.init.mode=always

# HikariCP Connection Pooling (tuned for RDS PostgreSQL on ECS Fargate)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.pool-name=PetClinicHikariPool

# --- Actuator (Hardened for Production) --------------------------------------
# Only expose health, info, and metrics endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.exposure.exclude=env,beans,configprops,mappings,threaddump,heapdump,shutdown,loggers
# Show full health details only when accessed from within the container
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
# Enable disk space and database health indicators
management.health.diskspace.enabled=true
management.health.db.enabled=true

# --- Health Checks for ALB ---------------------------------------------------
# Separate management port for health checks (ALB target group points here)
management.server.port=8081
# Health check path: ALB should target GET http://<host>:8081/actuator/health
management.endpoints.web.base-path=/actuator

# Health check group for ALB liveness/readiness probes
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.show-details=never
management.endpoint.health.probes.enabled=true

# --- Graceful Shutdown -------------------------------------------------------
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# --- Server Configuration ---------------------------------------------------
server.port=8080

# --- Structured Logging (JSON for CloudWatch/ECS) ----------------------------
logging.structured.format.console=ecs
logging.level.root=WARN
logging.level.org.springframework=INFO
logging.level.org.springframework.samples.petclinic=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.stat=WARN

# --- JPA / Hibernate (Production Tuning) -------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Thymeleaf (Production) -------------------------------------------------
spring.thymeleaf.cache=true

# --- Security Headers -------------------------------------------------------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
