# Database - RDS PostgreSQL (credentials from environment variables)
database=postgres
spring.datasource.url=${RDS_JDBC_URL:jdbc:postgresql://localhost:5432/petclinic}
spring.datasource.username=${RDS_USERNAME:petclinic}
spring.datasource.password=${RDS_PASSWORD:petclinic}
spring.sql.init.mode=never

# JPA - disable DDL auto (schema managed by migration tool)
spring.jpa.hibernate.ddl-auto=validate

# Actuator - restrict exposed endpoints for production security
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.show-details=never

# Server
server.port=8080

# Logging - production level
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
