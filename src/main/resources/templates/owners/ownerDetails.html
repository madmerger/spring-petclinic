<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2 th:text="#{ownerInformation}">Owner Information</h2>

  <div th:if="${message}" class="alert alert-success" id="success-message">
    <span th:text="${message}"></span>
  </div>

  <div th:if="${error}" class="alert alert-danger" id="error-message">
    <span th:text="${error}"></span>
  </div>

  <div class="owner-info-card" th:object="${owner}">
    <div class="owner-info-grid">
      <div class="owner-info-item">
        <span class="owner-info-label" th:text="#{name}">Name</span>
        <span class="owner-info-value" th:text="*{firstName + ' ' + lastName}"></span>
      </div>
      <div class="owner-info-item">
        <span class="owner-info-label" th:text="#{address}">Address</span>
        <span class="owner-info-value" th:text="*{address}"></span>
      </div>
      <div class="owner-info-item">
        <span class="owner-info-label" th:text="#{city}">City</span>
        <span class="owner-info-value" th:text="*{city}"></span>
      </div>
      <div class="owner-info-item">
        <span class="owner-info-label" th:text="#{telephone}">Telephone</span>
        <span class="owner-info-value" th:text="*{telephone}"></span>
      </div>
    </div>
    <div class="owner-actions">
      <a th:href="@{__${owner.id}__/edit}" class="btn btn-primary" th:text="#{editOwner}">Edit Owner</a>
      <a th:href="@{__${owner.id}__/pets/new}" class="btn btn-outline-secondary" th:text="#{addNewPet}">Add New Pet</a>
    </div>
  </div>

  <h2 th:text="#{petsAndVisits}" class="pets-section-title">Pets and Visits</h2>

  <div class="pet-cards-grid">
    <div th:each="pet : ${owner.pets}" class="pet-card">
      <div class="pet-card-header">
        <span class="fa fa-paw pet-card-icon" aria-hidden="true"></span>
        <h3 class="pet-card-name" th:text="${pet.name}">Pet Name</h3>
        <span class="pet-card-type" th:text="${pet.type}">Type</span>
      </div>
      <div class="pet-card-body">
        <div class="pet-card-detail">
          <span class="pet-detail-label" th:text="#{birthDate}">Birth Date</span>
          <span class="pet-detail-value" th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></span>
        </div>

        <div th:if="${!pet.visits.isEmpty()}" class="pet-visits-section">
          <h4 class="pet-visits-title" th:text="#{visitHistory}">Visit History</h4>
          <div class="pet-visit-list">
            <div th:each="visit : ${pet.visits}" class="pet-visit-item">
              <span class="pet-visit-date" th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></span>
              <span class="pet-visit-desc" th:text="${visit?.description}"></span>
            </div>
          </div>
        </div>
        <div th:if="${pet.visits.isEmpty()}" class="pet-no-visits" th:text="#{noVisitsRecorded}">
          No visits recorded
        </div>
      </div>
      <div class="pet-card-footer">
        <a th:href="@{__${owner.id}__/pets/__${pet.id}__/edit}" class="btn btn-sm btn-outline-primary"
          th:text="#{editPet}">Edit Pet</a>
        <a th:href="@{__${owner.id}__/pets/__${pet.id}__/visits/new}" class="btn btn-sm btn-outline-secondary"
          th:text="#{addVisit}">Add Visit</a>
      </div>
    </div>
  </div>

  <div th:if="${owner.pets.isEmpty()}" class="no-pets-message">
    <span class="fa fa-info-circle" aria-hidden="true"></span>
    <span th:text="#{noPetsRegistered}">No pets registered yet. Add a new pet to get started!</span>
  </div>

  <script>
    (function () {
      var success = document.getElementById("success-message");
      var error = document.getElementById("error-message");
      setTimeout(function () {
        if (success) success.style.display = "none";
        if (error) error.style.display = "none";
      }, 3000);
    })();
  </script>

</body>


</html>
