<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2 th:text="#{ownerInformation}">Owner Information</h2>

  <div th:if="${message}" class="alert alert-success" id="success-message">
    <span th:text="${message}"></span>
  </div>

  <div th:if="${error}" class="alert alert-danger" id="error-message">
    <span th:text="${error}"></span>
  </div>

  <div class="owner-info-card">
    <table class="table table-striped" th:object="${owner}">
      <tr>
        <th th:text="#{name}">Name</th>
        <td><b th:text="*{firstName + ' ' + lastName}"></b></td>
      </tr>
      <tr>
        <th th:text="#{address}">Address</th>
        <td th:text="*{address}"></td>
      </tr>
      <tr>
        <th th:text="#{city}">City</th>
        <td th:text="*{city}"></td>
      </tr>
      <tr>
        <th th:text="#{telephone}">Telephone</th>
        <td th:text="*{telephone}"></td>
      </tr>
    </table>

    <div class="owner-actions">
      <a th:href="@{__${owner.id}__/edit}" class="btn btn-primary" th:text="#{editOwner}">Edit Owner</a>
      <a th:href="@{__${owner.id}__/pets/new}" class="btn btn-primary" th:text="#{addNewPet}">Add New Pet</a>
    </div>
  </div>

  <h2 th:text="#{petsAndVisits}">Pets and Visits</h2>

  <div th:if="${#lists.isEmpty(owner.pets)}" class="empty-state-message" id="no-pets-message">
    <span class="fa fa-paw"></span>
    <span th:text="#{noPetsYet}">No pets registered yet.</span>
    <a th:href="@{__${owner.id}__/pets/new}" class="btn btn-primary btn-sm" th:text="#{addNewPet}">Add New Pet</a>
  </div>

  <div class="pet-cards-container" th:unless="${#lists.isEmpty(owner.pets)}">
    <div class="pet-card" th:each="pet : ${owner.pets}">
      <div class="pet-card-header">
        <span class="pet-card-name" th:text="${pet.name}">Buddy</span>
        <span class="pet-card-type" th:text="${pet.type}">dog</span>
      </div>
      <div class="pet-card-body">
        <div class="pet-card-info">
          <div class="pet-detail">
            <span class="pet-detail-label" th:text="#{birthDate}">Birth Date</span>
            <span class="pet-detail-value" th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}">2020-01-01</span>
          </div>
        </div>

        <div class="pet-card-visits">
          <h4 th:text="#{previousVisits}">Previous Visits</h4>
          <div th:if="${#lists.isEmpty(pet.visits)}" class="no-visits-message">
            <span th:text="#{noVisitsYet}">No visits recorded yet.</span>
          </div>
          <table th:unless="${#lists.isEmpty(pet.visits)}" class="table table-sm visit-table">
            <thead>
              <tr>
                <th th:text="#{visitDate}">Visit Date</th>
                <th th:text="#{description}">Description</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="visit : ${pet.visits}">
                <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
                <td th:text="${visit?.description}"></td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="pet-card-actions">
          <a th:href="@{__${owner.id}__/pets/__${pet.id}__/edit}" class="btn btn-primary btn-sm" th:text="#{editPet}">Edit Pet</a>
          <a th:href="@{__${owner.id}__/pets/__${pet.id}__/visits/new}" class="btn btn-primary btn-sm" th:text="#{addVisit}">Add Visit</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function hideMessages() {
      setTimeout(function () {
        var successMsg = document.getElementById("success-message");
        var errorMsg = document.getElementById("error-message");
        if (successMsg) successMsg.style.display = "none";
        if (errorMsg) errorMsg.style.display = "none";
      }, 3000);
    }
    hideMessages();
  </script>

</body>


</html>
