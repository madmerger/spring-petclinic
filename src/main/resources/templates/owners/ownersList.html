<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2 th:text="#{owners}">Owners</h2>

  <div class="results-count" th:if="${totalItems != null}">
    <span th:text="#{resultsFound(${totalItems})}">results found</span>
  </div>

  <div class="table-responsive">
    <table id="owners" class="table table-striped">
      <thead>
        <tr>
          <th th:text="#{name}" style="width: 150px;">Name</th>
          <th th:text="#{address}" style="width: 200px;">Address</th>
          <th th:text="#{city}">City</th>
          <th th:text="#{telephone}" style="width: 120px">Telephone</th>
          <th th:text="#{pets}">Pets</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="owner : ${listOwners}">
          <td>
            <a th:href="@{/owners/__${owner.id}__}" th:text="${owner.firstName + ' ' + owner.lastName}" /></a>
          </td>
          <td th:text="${owner.address}" />
          <td th:text="${owner.city}" />
          <td th:text="${owner.telephone}" />
          <td><span th:each="pet, stat : ${owner.pets}"><span class="pet-badge" th:text="${pet.name}">pet</span><span th:if="${!stat.last}"> </span></span></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div th:if="${totalPages > 1}" class="pagination-wrapper">
    <nav aria-label="Owner search results pagination">
      <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
          <a class="page-link" th:href="@{'/owners?page=1'}" th:title="#{first}">
            <span class="fa fa-fast-backward"></span>
          </a>
        </li>
        <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
          <a class="page-link" th:href="@{'/owners?page=__${currentPage - 1}__'}" th:title="#{previous}">
            <span class="fa fa-step-backward"></span>
          </a>
        </li>
        <li th:each="i : ${#numbers.sequence(1, totalPages)}" class="page-item"
            th:classappend="${currentPage == i} ? 'active'">
          <a class="page-link" th:href="@{'/owners?page=' + ${i}}" th:text="${i}">1</a>
        </li>
        <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
          <a class="page-link" th:href="@{'/owners?page=__${currentPage + 1}__'}" th:title="#{next}">
            <span class="fa fa-step-forward"></span>
          </a>
        </li>
        <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
          <a class="page-link" th:href="@{'/owners?page=__${totalPages}__'}" th:title="#{last}">
            <span class="fa fa-fast-forward"></span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</body>

</html>
