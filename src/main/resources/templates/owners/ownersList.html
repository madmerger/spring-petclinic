<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2 th:text="#{owners}">Owners</h2>

  <div class="owners-result-count">
    <span th:text="|Found ${totalItems} owner(s)|">Found N owner(s)</span>
  </div>

  <!-- Desktop table view -->
  <div class="owners-table-wrapper">
    <table id="owners" class="table table-striped table-hover">
      <thead>
        <tr>
          <th th:text="#{name}">Name</th>
          <th th:text="#{address}">Address</th>
          <th th:text="#{city}">City</th>
          <th th:text="#{telephone}">Telephone</th>
          <th th:text="#{pets}">Pets</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="owner : ${listOwners}">
          <td>
            <a th:href="@{/owners/__${owner.id}__}" th:text="${owner.firstName + ' ' + owner.lastName}"
              class="owner-link" /></a>
          </td>
          <td th:text="${owner.address}" />
          <td th:text="${owner.city}" />
          <td th:text="${owner.telephone}" />
          <td>
            <span th:each="pet, iterStat : ${owner.pets}" class="pet-badge">
              <span th:text="${pet.name}"></span><span th:unless="${iterStat.last}">, </span>
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Mobile card view -->
  <div class="owners-card-list">
    <div th:each="owner : ${listOwners}" class="owner-card">
      <div class="owner-card-header">
        <a th:href="@{/owners/__${owner.id}__}" th:text="${owner.firstName + ' ' + owner.lastName}"
          class="owner-link" />
      </div>
      <div class="owner-card-body">
        <div class="owner-card-detail">
          <span class="fa fa-map-marker" aria-hidden="true"></span>
          <span th:text="${owner.address + ', ' + owner.city}"></span>
        </div>
        <div class="owner-card-detail">
          <span class="fa fa-phone" aria-hidden="true"></span>
          <span th:text="${owner.telephone}"></span>
        </div>
        <div class="owner-card-detail" th:if="${!owner.pets.isEmpty()}">
          <span class="fa fa-paw" aria-hidden="true"></span>
          <span th:each="pet, iterStat : ${owner.pets}">
            <span th:text="${pet.name}"></span><span th:unless="${iterStat.last}">, </span>
          </span>
        </div>
      </div>
    </div>
  </div>

  <div th:if="${totalPages > 1}" class="pagination-wrapper">
    <nav aria-label="Owner search results pagination">
      <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
          <a class="page-link" th:href="@{'/owners?page=1'}" th:title="#{first}">
            <span class="fa fa-fast-backward" aria-hidden="true"></span>
          </a>
        </li>
        <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
          <a class="page-link" th:href="@{'/owners?page=__${currentPage - 1}__'}" th:title="#{previous}">
            <span class="fa fa-step-backward" aria-hidden="true"></span>
          </a>
        </li>
        <li th:each="i: ${#numbers.sequence(1, totalPages)}" class="page-item"
          th:classappend="${currentPage == i} ? 'active'">
          <a class="page-link" th:href="@{'/owners?page=' + ${i}}" th:text="${i}">1</a>
        </li>
        <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
          <a class="page-link" th:href="@{'/owners?page=__${currentPage + 1}__'}" th:title="#{next}">
            <span class="fa fa-step-forward" aria-hidden="true"></span>
          </a>
        </li>
        <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
          <a class="page-link" th:href="@{'/owners?page=__${totalPages}__'}" th:title="#{last}">
            <span class="fa fa-fast-forward" aria-hidden="true"></span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</body>

</html>
