<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <div class="search-hero">
    <h2 th:text="#{findOwners}">Find Owners</h2>
    <p class="search-subtitle" th:text="#{searchSubtitle}">Search by last name to find pet owners in our system</p>

    <form th:object="${owner}" th:action="@{/owners}" method="get" class="search-form" id="search-owner-form">
      <div class="search-input-group">
        <span class="fa fa-search search-icon" aria-hidden="true"></span>
        <input class="form-control search-input" th:field="*{lastName}" size="30" maxlength="80"
          placeholder="Enter last name..." aria-label="Owner last name" />
        <button type="submit" class="btn btn-primary search-btn" th:text="#{findOwner}">Find Owner</button>
      </div>
      <div th:if="${#fields.hasAnyErrors()}" class="search-errors">
        <p th:each="err : ${#fields.allErrors()}" th:text="${err}" class="text-danger">Error</p>
      </div>
    </form>

    <a class="btn btn-outline-secondary add-owner-btn" th:href="@{/owners/new}" th:text="#{addOwner}">Add Owner</a>
  </div>

</body>

</html>
